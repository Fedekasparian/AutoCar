<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehículo - AutoCar</title>
  <meta name="description" content="Detalle de un vehículo publicado en AutoCar.">
  <link rel="stylesheet" href="../../styles/estilos.css">
  <link rel="stylesheet" href="../../styles/componentes.css">
  <link rel="stylesheet" href="../../styles/pantallas.css">
  <link rel="stylesheet" href="../../styles/print.css" media="print">
  <script type="module" src="../../js/paginas/vehiculo.js"></script>
</head>
<body class="con-barra">

  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <nav class="barra" aria-label="Navegación principal">
    <a class="barra__marca" href="../info/home.html">AutoCar</a>
    <ul class="barra__lista">
      <li>
        <a class="barra__enlace" href="../info/home.html" aria-current="page">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>
          Home
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="../operaciones/meta-busqueda.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></span>
          Meta-S
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="mis-publicaciones.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
          Publicar
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="../operaciones/mensajes.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span>
          Mensajes
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="../auth/cuenta.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
          Cuenta
        </a>
      </li>
    </ul>
  </nav>

  <header class="encabezado">
    <a class="encabezado__volver" href="../info/home.html" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M4 12l7-7M4 12l7 7"/></svg>
    </a>
    <h1>Detalle</h1>
  </header>

  <!-- Los datos los completa js/paginas/vehiculo.js con GET /api/vehiculos/{id} (vehiculo.html?id=N).
       Verificación, tasación, ubicación, publicador y favoritos todavía no están en la API:
       el maquetado de esas partes está en la historia de git y en guia.html. -->
  <main id="contenido" class="pantalla detalle">

    <div class="estado" id="estado"></div>

    <figure class="galeria" id="vehiculo" hidden>
      <div class="galeria__principal" id="vehiculo-foto"></div>
      <figcaption class="solo-lector" id="vehiculo-foto-texto"></figcaption>
    </figure>

    <div class="detalle__info" id="vehiculo-info" hidden>

      <section class="detalle__titulo" aria-labelledby="vehiculo-titulo">
        <h2 id="vehiculo-titulo"></h2>
        <p class="detalle__precio" id="vehiculo-precio"></p>
        <p class="suave" id="vehiculo-resumen"></p>
        <p id="vehiculo-vendido" hidden><span class="etiqueta etiqueta--oscura">Vendido</span></p>
      </section>

      <section aria-labelledby="ficha-titulo">
        <h2 id="ficha-titulo" class="titulo-seccion">Ficha técnica</h2>
        <dl class="datos">
          <dt>Marca</dt><dd id="dato-marca"></dd>
          <dt>Modelo</dt><dd id="dato-modelo"></dd>
          <dt>Año</dt><dd id="dato-anio"></dd>
          <dt>Kilometraje</dt><dd id="dato-kilometraje"></dd>
          <dt>Combustible</dt><dd id="dato-combustible"></dd>
          <dt>Transmisión</dt><dd id="dato-transmision"></dd>
          <dt>Estado</dt><dd id="dato-estado"></dd>
        </dl>
      </section>

      <section class="pila" aria-labelledby="descripcion-titulo" id="vehiculo-descripcion" hidden>
        <h2 id="descripcion-titulo">Descripción</h2>
        <p id="vehiculo-descripcion-texto"></p>
      </section>

      <div class="detalle__acciones">
        <a class="boton" href="../operaciones/conversacion.html">Consultar</a>
        <a class="boton boton--secundario" href="../operaciones/proponer-canje.html">Proponer canje</a>
      </div>
      <a class="boton boton--secundario boton--bloque" id="vehiculo-editar" hidden>Editar (administración)</a>
      <a class="detalle__reportar" href="../info/reportar.html">Reportar publicación</a>

    </div>
  </main>

</body>
</html>
