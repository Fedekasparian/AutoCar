<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - AutoCar</title>
  <meta name="description" content="Creá tu cuenta de AutoCar para publicar, guardar favoritos y proponer canjes.">
  <link rel="stylesheet" href="../../styles/estilos.css">
  <link rel="stylesheet" href="../../styles/componentes.css">
  <link rel="stylesheet" href="../../styles/pantallas.css">
  <link rel="stylesheet" href="../../styles/print.css" media="print">
  <script src="../../js/validacion.js" defer></script>
  <script type="module" src="../../js/paginas/registro.js"></script>
</head>
<body>

  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="encabezado">
    <a class="encabezado__volver" href="../../index.html" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M4 12l7-7M4 12l7 7"/></svg>
    </a>
    <h1>Crear cuenta</h1>
  </header>

  <main id="contenido" class="pantalla acceso">
    <nav class="alternar" aria-label="Ingresar o crear cuenta">
      <a class="alternar__opcion" href="login.html">Ingresar</a>
      <a class="alternar__opcion" href="registro.html" aria-current="page">Crear cuenta</a>
    </nav>

    <!-- Lo envía js/paginas/registro.js con POST /api/registro. Las reglas son las mismas que valida el back. -->
    <form class="formulario" id="form-registro" novalidate>
      <p class="formulario__alerta" role="alert" tabindex="-1"></p>
      <div class="campo">
        <label class="campo__etiqueta" for="nombre">Nombre</label>
        <input class="campo__input" id="nombre" name="nombre" type="text" autocomplete="name"
               minlength="2" maxlength="80" required aria-describedby="nombre-error">
        <span class="campo__error" id="nombre-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="email">Email</label>
        <input class="campo__input" id="email" name="email" type="email" inputmode="email" autocomplete="email"
               autocapitalize="none" spellcheck="false" maxlength="254" required aria-describedby="email-error">
        <span class="campo__error" id="email-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="password">Contraseña</label>
        <input class="campo__input" id="password" name="password" type="password" autocomplete="new-password"
               minlength="8" maxlength="72" required pattern="(?=.*[A-Za-z])(?=.*\d).+"
               data-error-formato="La contraseña necesita al menos una letra y un número."
               aria-describedby="password-ayuda password-error">
        <span class="campo__ayuda" id="password-ayuda">Al menos 8 caracteres, con una letra y un número.</span>
        <span class="campo__error" id="password-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="password_confirm">Repetí la contraseña</label>
        <input class="campo__input" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password"
               maxlength="72" required aria-describedby="password_confirm-error">
        <span class="campo__error" id="password_confirm-error"></span>
      </div>
      <button class="boton boton--bloque" type="submit">Crear cuenta</button>
    </form>

    <p class="acceso__pie">¿Ya tenés cuenta? <a href="login.html">Ingresá</a></p>
  </main>

</body>
</html>
