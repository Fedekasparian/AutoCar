<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - AutoCar</title>
  <meta name="description" content="Creá tu cuenta de AutoCar para publicar, guardar favoritos y proponer canjes.">
  <link rel="stylesheet" href="../../styles/estilos.css">
  <link rel="stylesheet" href="../../styles/componentes.css">
  <link rel="stylesheet" href="../../styles/pantallas.css">
  <link rel="stylesheet" href="../../styles/identidad.css">
  <script src="../../js/tema.js"></script><script src="../../js/barra-admin.js" defer></script>
  <link rel="stylesheet" href="../../styles/print.css" media="print">
  <script src="../../js/validacion.js" defer></script>
  <script type="module" src="../../js/paginas/registro.js"></script>
<link rel="stylesheet" href="../../styles/portada.css">
</head>
<body class="auth-page">

  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <header class="marca-nav marca-nav--acceso"><a class="marca" href="../../index.html" aria-label="AutoCar, inicio"><span class="marca__simbolo" aria-hidden="true"></span>AutoCar</a><a href="../../index.html">Volver al inicio</a></header>

  <div class="acceso-layout">
<aside class="acceso-relato"><p class="acceso-relato__titulo">Autos entre particulares.</p>
<p>Encontrá un vehículo o publicá el tuyo en AutoCar.</p>
<img src="../../assets/identidad/hero.jpg" width="1536" height="1024" alt="Auto en un camino rural, imagen ilustrativa"></aside><main id="contenido" class="pantalla acceso"><div>
<h1>Crear cuenta</h1>
<p class="suave">Completá tus datos para registrarte.</p>
</div>


    <!-- Lo envía js/paginas/registro.js con POST /api/registro. Las reglas son las mismas que valida el back. -->
    <form class="formulario" id="form-registro" novalidate>
      <p class="formulario__alerta" role="alert" tabindex="-1"></p>
      <div class="campo">
        <label class="campo__etiqueta" for="nombre">Nombre</label>
        <input class="campo__input" id="nombre" name="nombre" type="text" autocomplete="name" minlength="2" maxlength="80" required aria-describedby="nombre-error">
        <span class="campo__error" id="nombre-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="email">Email</label>
        <input class="campo__input" id="email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required aria-describedby="email-error">
        <span class="campo__error" id="email-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="password">Contraseña</label>
        <input class="campo__input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required pattern="(?=.*[A-Za-z])(?=.*\d).+" data-error-formato="La contraseña necesita al menos una letra y un número." aria-describedby="password-ayuda password-error">
        <span class="campo__ayuda" id="password-ayuda">Al menos 8 caracteres, con una letra y un número.</span>
        <span class="campo__error" id="password-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="password_confirm">Repetí la contraseña</label>
        <input class="campo__input" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" maxlength="72" required aria-describedby="password_confirm-error">
        <span class="campo__error" id="password_confirm-error"></span>
      </div>
      <button class="boton boton--bloque" type="submit">Crear cuenta</button>
    </form>

    <p class="acceso__pie">¿Ya tenés cuenta? <a href="login.html">Ingresá</a></p>
  </main>
</div>

</body>
</html>
