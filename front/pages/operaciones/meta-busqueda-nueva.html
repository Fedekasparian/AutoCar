</head>
<body class="con-barra vista-meta-busqueda-nueva">

  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <nav class="barra" aria-label="Navegación principal"><a class="barra__marca" href="../../index.html" aria-label="AutoCar, inicio"><span class="marca__simbolo" aria-hidden="true"></span>AutoCar</a><ul class="barra__lista">
<li><a class="barra__enlace" href="../info/home.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h14V10"></path></svg></span><span>Explorar</span></a></li>

<li><a class="barra__enlace" href="../vehiculos/mis-publicaciones.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg></span><span>Publicar</span></a></li>

    <a class="encabezado__volver" href="meta-busqueda.html" aria-label="Volver">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M4 12l7-7M4 12l7 7"></path></svg>

    <h1>Nueva búsqueda</h1>
  </header>

  <!-- POST /api/meta-busquedas (js/paginas/meta-busqueda-nueva.js). Las marcas y modelos son los del catálogo de
       la base (GET /api/marcas-modelos), los mismos que en Publicar. -->
  <main id="contenido" class="pantalla pantalla--compacta">
    <form class="formulario" id="form-busqueda" novalidate>
      <p class="formulario__alerta" role="alert" tabindex="-1"></p>
      <div class="campo">
        <label class="campo__etiqueta" for="marca">Marca</label>
        <select class="campo__input" id="marca" name="marca" required aria-describedby="marca-error"><option value="">Seleccionar marca</option></select>
        <span class="campo__error" id="marca-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="modelo">Modelo</label>
        <select class="campo__input" id="modelo" name="modelo" required aria-describedby="modelo-error"><option value="">Seleccionar modelo</option></select>
        <span class="campo__error" id="modelo-error"></span>
      </div>
      <div class="campos-fila">
        <div class="campo">
          <label class="campo__etiqueta" for="anio_desde">Año desde <span class="suave">(opcional)</span></label>
          <input class="campo__input" id="anio_desde" name="anio_desde" type="number" inputmode="numeric" min="1950" max="2027" aria-describedby="anio_desde-error">
          <span class="campo__error" id="anio_desde-error"></span>
        </div>
        <div class="campo">
          <label class="campo__etiqueta" for="anio_hasta">Año hasta <span class="suave">(opcional)</span></label>
          <input class="campo__input" id="anio_hasta" name="anio_hasta" type="number" inputmode="numeric" min="1950" max="2027" aria-describedby="anio_hasta-error">
          <span class="campo__error" id="anio_hasta-error"></span>
        </div>
      </div>
      <div class="campos-fila">
        <div class="campo">
          <label class="campo__etiqueta" for="precio_max">Precio máximo <span class="suave">(opcional)</span></label>
          <input class="campo__input" id="precio_max" name="precio_max" type="number" inputmode="numeric" min="0" placeholder="12000000" aria-describedby="precio_max-error">
          <span class="campo__error" id="precio_max-error"></span>
        </div>
        <div class="campo">
          <label class="campo__etiqueta" for="km_max">Km máximo <span class="suave">(opcional)</span></label>
          <input class="campo__input" id="km_max" name="km_max" type="number" inputmode="numeric" min="0" placeholder="120000" aria-describedby="km_max-error">
          <span class="campo__error" id="km_max-error"></span>
        </div>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="transmision">Transmisión <span class="suave">(opcional)</span></label>
        <select class="campo__input" id="transmision" name="transmision">
          <option value="">Cualquiera</option>
          <option value="manual">Manual</option>
          <option value="automatica">Automática</option>
        </select>
      </div>
      <button class="boton" type="submit">Guardar búsqueda</button>
    </form>
  </main>

</body>
</html>
