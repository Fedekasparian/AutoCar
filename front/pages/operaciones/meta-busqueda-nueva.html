<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva búsqueda - AutoCar</title>
  <meta name="description" content="Guardá una búsqueda y te avisamos cuando aparezca.">
  <link rel="stylesheet" href="styles/estilos.css">
  <link rel="stylesheet" href="styles/componentes.css">
  <link rel="stylesheet" href="styles/pantallas.css">
  <link rel="stylesheet" href="styles/print.css" media="print">
  <script src="js/validacion.js" defer></script>
</head>
<body class="con-barra">

  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <nav class="barra" aria-label="Navegación principal">
    <a class="barra__marca" href="home.html">AutoCar</a>
    <ul class="barra__lista">
      <li>
        <a class="barra__enlace" href="home.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>
          Home
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="meta-busqueda.html" aria-current="page">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></span>
          Meta-S
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="mis-publicaciones.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
          Publicar
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="mensajes.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span>
          Mensajes
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="cuenta.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
          Cuenta
        </a>
      </li>
    </ul>
  </nav>

  <header class="encabezado">
    <a class="encabezado__volver" href="meta-busqueda.html" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M4 12l7-7M4 12l7 7"/></svg>
    </a>
    <h1>Nueva búsqueda</h1>
  </header>

  <main id="contenido" class="pantalla pantalla--compacta">
    <form class="formulario" action="/meta-busqueda" method="post" data-validar novalidate>
      <p class="formulario__alerta" role="alert" tabindex="-1"></p>
      <!-- Texto libre: el back lo manda al LLM y devuelve los criterios para precargar el formulario.
           El usuario siempre revisa antes de guardar. -->
      <div class="campo">
        <label class="campo__etiqueta" for="texto"><strong>Describí el auto que buscás</strong></label>
        <textarea class="campo__input" id="texto" name="texto" maxlength="300">Busco un Corolla automático, del 2015 en adelante, que no pase los 9 millones.</textarea>
      </div>
      <button class="boton boton--secundario" type="submit" formaction="/meta-busqueda/interpretar" formnovalidate>Completar con IA</button>
      <p class="campo__ayuda">La IA completa los campos. Revisalos antes de guardar.</p>
      <hr>
      <div class="campo">
        <label class="campo__etiqueta" for="marca">Marca <span class="etiqueta">IA</span></label>
        <select class="campo__input" id="marca" name="marca" required aria-describedby="marca-error"><option value="">Seleccionar marca</option><option selected>Toyota</option><option>Ford</option></select>
        <span class="campo__error" id="marca-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="modelo">Modelo <span class="etiqueta">IA</span></label>
        <select class="campo__input" id="modelo" name="modelo"><option value="">Cualquiera</option><option selected>Corolla</option><option>Etios</option></select>
      </div>
      <div class="campos-fila">
      <div class="campo">
        <label class="campo__etiqueta" for="anio_desde">Año desde <span class="etiqueta">IA</span></label>
        <input class="campo__input" id="anio_desde" name="anio_desde" type="number" value="2015" min="1980" aria-describedby="anio_desde-error">
        <span class="campo__error" id="anio_desde-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="anio_hasta">Año hasta</label>
        <input class="campo__input" id="anio_hasta" name="anio_hasta" type="number" placeholder="Completá este dato" min="1980" aria-describedby="anio_hasta-error">
        <span class="campo__error" id="anio_hasta-error"></span>
      </div>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="precio_max">Precio máximo <span class="etiqueta">IA</span></label>
        <input class="campo__input" id="precio_max" name="precio_max" type="number" value="9000000" min="0" aria-describedby="precio_max-error">
        <span class="campo__error" id="precio_max-error"></span>
      </div>
      <button class="boton boton--bloque" type="submit">Guardar y buscar</button>
      <a class="boton boton--secundario boton--bloque" href="meta-busqueda-resultados.html">Ver estadísticas de mercado</a>
    </form>
  </main>

</body>
</html>
