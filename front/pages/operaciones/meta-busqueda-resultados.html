<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultados - AutoCar</title>
  <meta name="description" content="Coincidencias de tu búsqueda guardada.">
  <link rel="stylesheet" href="../../styles/estilos.css">
  <script src="../../js/tema.js"></script><script src="../../js/dialogos.js" defer></script><script src="../../js/barra-admin.js" defer></script><script type="module" src="../../js/paginas/meta-busqueda-resultados.js"></script><link rel="stylesheet" href="../../styles/componentes.css">
  <link rel="stylesheet" href="../../styles/pantallas.css">
  <link rel="stylesheet" href="../../styles/print.css" media="print">
<link rel="stylesheet" href="../../styles/identidad.css">
<link rel="stylesheet" href="../../styles/portada.css">
<link rel="stylesheet" href="../../styles/interiores.css">
</head>
<body class="con-barra vista-meta-busqueda-resultados">

  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <nav class="barra" aria-label="Navegación principal"><a class="barra__marca" href="../../index.html" aria-label="AutoCar, inicio"><span class="marca__simbolo" aria-hidden="true"></span>AutoCar</a><ul class="barra__lista">
<li><a class="barra__enlace" href="../info/home.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h14V10"></path></svg></span><span>Explorar</span></a></li>
<li><a class="barra__enlace" href="../operaciones/meta-busqueda.html" aria-current="page"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg></span><span>Búsquedas</span></a></li>
<li><a class="barra__enlace" href="../vehiculos/mis-publicaciones.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg></span><span>Publicar</span></a></li>
<li><a class="barra__enlace" href="../operaciones/mensajes.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span><span>Mensajes</span></a></li>
<li><a class="barra__enlace" href="../auth/cuenta.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span><span>Cuenta</span></a></li>
</ul></nav><header class="encabezado">
    <a class="encabezado__volver" href="meta-busqueda.html" aria-label="Volver">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H4M4 12l7-7M4 12l7 7"></path></svg>
    </a>
    <h1 id="titulo">Resultados</h1>
  </header>

  <!-- GET /api/meta-busquedas/{id} (js/paginas/meta-busqueda-resultados.js?id=N): referencia de precio,
       novedades, destacados y los autos de todas las fuentes. Cada uno con "Mandale un mecánico" (link fijo). -->
  <main id="contenido" class="pantalla">
    <div class="estado" id="estado"></div>
    <section class="pila" id="resumen" hidden aria-label="Resumen de la búsqueda">
      <p class="recuadro" id="referencia"></p>
      <p class="suave" id="novedades"></p>
      <p class="campo__ayuda" id="aclaracion"></p>
    </section>
    <form class="campos-fila" id="filtros" hidden>
      <div class="campo">
        <label class="campo__etiqueta" for="orden">Ordenar por</label>
        <select class="campo__input" id="orden" name="orden">
          <option value="precio">Menor precio</option>
          <option value="km">Menos km</option>
          <option value="nuevos">Más nuevos</option>
        </select>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="fuente">Sitio</label>
        <select class="campo__input" id="fuente" name="fuente">
          <option value="">Todos</option>
          <option value="mercadolibre">MercadoLibre</option>
          <option value="kavak">Kavak</option>
          <option value="autocosmos">Autocosmos</option>
          <option value="autocar">AutoCar</option>
        </select>
      </div>
    </form>
    <ul class="lista-filas" role="list" id="resultados"></ul>
    <nav id="paginacion"></nav>
    <button class="boton boton--secundario" type="button" id="borrar" data-abrir="dialogo-borrar" hidden>Borrar esta búsqueda</button>
  </main>

  <!-- DELETE /api/meta-busquedas/{id} -->
  <dialog class="hoja" id="dialogo-borrar" aria-labelledby="borrar-titulo">
    <div class="pila">
      <h2 id="borrar-titulo">¿Borrar esta búsqueda?</h2>
      <p id="borrar-texto">Dejás de recibir avisos de autos nuevos y bajas de precio. Los autos siguen en los sitios: podés volver a buscarlos cuando quieras.</p>
      <p class="formulario__alerta" id="borrar-error" role="alert" tabindex="-1"></p>
      <div class="hoja__acciones">
        <button class="boton boton--secundario" type="button" data-cerrar>Volver</button>
        <button class="boton" type="button" id="confirmar-borrar">Borrar</button>
      </div>
    </div>
  </dialog>

</body>
</html>
