    <h1>Contacto</h1>
  </header>

  <main id="contenido" class="pantalla">
    <!-- POST /api/contacto (público): js/paginas/contacto.js. Lo lee el admin en el panel. -->
    <p class="recuadro" id="enviado" role="status" hidden>¡Gracias! Recibimos tu mensaje y te vamos a contestar por mail.</p>
    <form class="formulario" id="form-contacto" novalidate>
      <p class="formulario__alerta" role="alert" tabindex="-1"></p>
      <div class="campo">
        <label class="campo__etiqueta" for="email">Email</label>
        <input class="campo__input" id="email" name="email" type="email" required aria-describedby="email-error">
        <span class="campo__error" id="email-error"></span>
      </div>
      <div class="campo">
        <label class="campo__etiqueta" for="mensaje">Mensaje</label>
        <textarea class="campo__input" id="mensaje" name="mensaje" required minlength="10" maxlength="1000" aria-describedby="mensaje-error"></textarea>
        <span class="campo__error" id="mensaje-error"></span>
      </div>
      <button class="boton" type="submit">Enviar</button>
    </form>
  </main>
