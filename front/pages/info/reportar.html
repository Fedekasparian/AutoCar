    <h1>Reportar</h1>

  <main id="contenido" class="pantalla">
    <form class="formulario" action="/reportes" method="post" data-validar novalidate>
      <p class="formulario__alerta" role="alert" tabindex="-1"></p>
      <input type="hidden" name="tipo" value="publicacion">
      <input type="hidden" name="objetivo_id" value="4">
      <fieldset class="opciones">
        <legend class="titulo-seccion">¿Qué pasa con esta publicación?</legend>
        <label><input type="radio" name="motivo" value="fraude" checked><span>Parece una estafa</span></label>
        <label><input type="radio" name="motivo" value="datos"><span>Los datos no coinciden con el vehículo</span></label>
        <label><input type="radio" name="motivo" value="vendido"><span>Ya está vendido</span></label>
        <label><input type="radio" name="motivo" value="otro"><span>Otro motivo</span></label>
      </fieldset>
      <div class="campo">
        <label class="campo__etiqueta" for="detalle">Detalle <span class="suave">(opcional)</span></label>
        <textarea class="campo__input" id="detalle" name="detalle" maxlength="500"></textarea>
      </div>
      <button class="boton" type="submit">Enviar reporte</button>
    </form>
