  <meta charset="UTF-8">

</head>
<body class="con-barra vista-home">

  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <nav class="barra" aria-label="Navegación principal"><a class="barra__marca" href="../../index.html" aria-label="AutoCar, inicio"><span class="marca__simbolo" aria-hidden="true"></span>AutoCar</a><ul class="barra__lista">
<li><a class="barra__enlace" href="../info/home.html" aria-current="page"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h14V10"></path></svg></span><span>Explorar</span></a></li>
<li><a class="barra__enlace" href="../operaciones/meta-busqueda.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg></span><span>Búsquedas</span></a></li>
<li><a class="barra__enlace" href="../vehiculos/mis-publicaciones.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M4 12h16"></path></svg></span><span>Publicar</span></a></li>
<li><a class="barra__enlace" href="../operaciones/mensajes.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg></span><span>Mensajes</span></a></li>
<li><a class="barra__enlace" href="../auth/cuenta.html"><span class="barra__icono"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span><span>Cuenta</span></a></li>
</ul></nav><header class="contenedor catalogo-intro"><div>
<h1>Explorá vehículos</h1>
<p>Filtrá por marca, precio o combustible.</p>
</div>
<a class="enlace-flecha" href="mapa.html">Ver mapa</a></header>

  <main id="contenido" class="pantalla pantalla--compacta">

    <!-- Búsqueda por texto: lleva a la búsqueda con todos los filtros -->
    <form class="buscador" action="home.html" method="get" role="search">
      <label class="solo-lector" for="q">Buscar vehículos</label>
      <input class="campo__input" id="q" name="q" type="search" placeholder="Marca, modelo o versión" maxlength="60">
      <button class="boton" type="submit">Buscar</button>
    </form>

    <!-- Filtros rápidos: se aplican sobre esta misma página (GET). Las marcas las carga js/paginas/catalogo.js -->
    <form action="home.html" method="get">
      <input type="hidden" name="q">
      <fieldset class="filtros-rapidos">
        <legend class="solo-lector">Filtros rápidos</legend>
        <label class="solo-lector" for="f-marca">Marca</label>
        <select class="campo__input" id="f-marca" name="marca">
          <option value="">Marca</option>
        </select>
        <label class="solo-lector" for="f-precio">Precio máximo</label>
        <select class="campo__input" id="f-precio" name="precio_max">
          <option value="">Precio</option>
          <option value="6000000">Hasta $6.000.000</option>
          <option value="9000000">Hasta $9.000.000</option>
          <option value="12000000">Hasta $12.000.000</option>
          <option value="20000000">Hasta $20.000.000</option>
          <option value="30000000">Hasta $30.000.000</option>
          <option value="45000000">Hasta $45.000.000</option>
        </select>
        <label class="solo-lector" for="f-combustible">Combustible</label>
        <select class="campo__input" id="f-combustible" name="combustible">
          <option value="">Combustible</option>
          <option value="nafta">Nafta</option>
          <option value="diesel">Diésel</option>
          <option value="gnc">GNC</option>
          <option value="hibrido">Híbrido</option>
          <option value="electrico">Eléctrico</option>
        </select>
      </fieldset>
      <p class="resultados__barra">
        <span class="suave" id="resultados-total" aria-live="polite"></span>
        <button class="boton boton--secundario boton--chico" type="submit">Aplicar filtros</button>
      </p>
    </form>

    <!-- Grilla de publicaciones: la arma js/paginas/catalogo.js con GET /api/vehiculos
         (foto, precio, modelo, km y combustible; ver fichaVehiculo en js/servicios/vistas.js).
         Si no hay resultados, después de la grilla se muestra el estado vacío. -->
    <ul class="grilla-vehiculos" id="resultados" role="list"></ul>

    <nav class="paginacion" id="paginacion" aria-label="Páginas de resultados"></nav>

  </main>

</body>
</html>
