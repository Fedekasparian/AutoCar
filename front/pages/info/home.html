<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - AutoCar</title>
  <meta name="description" content="Publicaciones de vehículos en AutoCar.">
  <link rel="stylesheet" href="../../styles/estilos.css">
  <link rel="stylesheet" href="../../styles/componentes.css">
  <link rel="stylesheet" href="../../styles/pantallas.css">
  <link rel="stylesheet" href="../../styles/print.css" media="print">
  <script type="module" src="../../js/paginas/catalogo.js"></script>
</head>
<body class="con-barra">

  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <nav class="barra" aria-label="Navegación principal">
    <a class="barra__marca" href="home.html">AutoCar</a>
    <ul class="barra__lista">
      <li>
        <a class="barra__enlace" href="home.html" aria-current="page">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></span>
          Home
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="../operaciones/meta-busqueda.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg></span>
          Meta-S
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="../vehiculos/mis-publicaciones.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
          Publicar
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="../operaciones/mensajes.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span>
          Mensajes
        </a>
      </li>
      <li>
        <a class="barra__enlace" href="../auth/cuenta.html">
          <span class="barra__icono"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
          Cuenta
        </a>
      </li>
    </ul>
  </nav>

  <header class="encabezado">
    <h1>Explorar</h1>
    <a class="encabezado__accion" href="mapa.html" aria-label="Ver en el mapa">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>
    </a>
  </header>

  <main id="contenido" class="pantalla pantalla--compacta">

    <!-- Búsqueda por texto: lleva a la búsqueda con todos los filtros -->
    <form class="buscador" action="../vehiculos/buscar.html" method="get" role="search">
      <label class="solo-lector" for="q">Buscar vehículos</label>
      <input class="campo__input" id="q" name="q" type="search" placeholder="Marca, modelo o versión" maxlength="60">
      <button class="boton" type="submit">Buscar</button>
    </form>

    <!-- Filtros rápidos: se aplican sobre esta misma página (GET). Las marcas las carga js/paginas/catalogo.js -->
    <form action="home.html" method="get">
      <fieldset class="filtros-rapidos">
        <legend class="solo-lector">Filtros rápidos</legend>
        <label class="solo-lector" for="f-marca">Marca</label>
        <select class="campo__input" id="f-marca" name="marca">
          <option value="">Marca</option>
        </select>
        <label class="solo-lector" for="f-precio">Precio máximo</label>
        <select class="campo__input" id="f-precio" name="precio_max">
          <option value="">Precio</option>
          <option value="12000000">Hasta $12.000.000</option>
          <option value="20000000">Hasta $20.000.000</option>
          <option value="30000000">Hasta $30.000.000</option>
          <option value="45000000">Hasta $45.000.000</option>
        </select>
        <label class="solo-lector" for="f-combustible">Combustible</label>
        <select class="campo__input" id="f-combustible" name="combustible">
          <option value="">Combustible</option>
          <option value="nafta">Nafta</option>
          <option value="diesel">Diésel</option>
          <option value="gnc">GNC</option>
          <option value="hibrido">Híbrido</option>
          <option value="electrico">Eléctrico</option>
        </select>
      </fieldset>
      <p class="resultados__barra">
        <span class="suave" id="resultados-total" aria-live="polite"></span>
        <button class="boton boton--secundario boton--chico" type="submit">Aplicar filtros</button>
      </p>
    </form>

    <!-- Grilla de publicaciones: la arma js/paginas/catalogo.js con GET /api/vehiculos
         (foto, precio, modelo, km y combustible; ver fichaVehiculo en js/servicios/vistas.js).
         Si no hay resultados, después de la grilla se muestra el estado vacío. -->
    <ul class="grilla-vehiculos" id="resultados" role="list"></ul>

    <nav class="paginacion" id="paginacion" aria-label="Páginas de resultados"></nav>

  </main>

</body>
</html>
