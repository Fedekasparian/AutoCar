<svg xmlns="http://www.w3.org/2000/svg" width="375" height="980" viewBox="0 0 375 980"><title>talleres-adherirse (formulario)</title><rect x="0" y="0" width="375" height="980" rx="0" fill="#FFFFFF" id="Fondo"/><g id="Header"><rect x="0" y="0" width="375" height="72" rx="0" fill="#FFFFFF"/><path d="M28 48 H12 M12 48 L19 41 M12 48 L19 55" stroke="#333333" stroke-width="2" fill="none" stroke-linecap="round"/><text x="187.5" y="54" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#333333" text-anchor="middle">Adherir mi taller</text><line x1="0" y1="72" x2="375" y2="72" stroke="#E0E0E0" stroke-width="1"/></g><text x="20" y="100" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Sumate a la red de talleres de AutoCar.</text><text x="20" y="118" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Revisamos cada solicitud antes de activarla.</text><g id="Campo Nombre del taller"><text x="20" y="152" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Nombre del taller</text><rect x="20" y="160" width="335" height="40" rx="4" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/><text x="32" y="185.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#AAAAAA" text-anchor="start">Ej: Taller San Martín</text></g><g id="Campo CUIT"><text x="20" y="218" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">CUIT</text><rect x="20" y="226" width="335" height="40" rx="4" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/><text x="32" y="251.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#AAAAAA" text-anchor="start">30-12345678-9</text></g><g id="Campo Dirección"><text x="20" y="284" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Dirección</text><rect x="20" y="292" width="335" height="40" rx="4" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/><text x="32" y="317.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#AAAAAA" text-anchor="start">Calle, número y localidad</text></g><g id="Mapa dirección"><rect x="20" y="340" width="335" height="90" rx="4" fill="#E9E9E9"/><g id="Pin"><path d="M187.5 398 C177.5 386 176.5 380 176.5 376 A11 11 0 1 1 198.5 376 C198.5 380 197.5 386 187.5 398 Z" fill="#333333"/><circle cx="187.5" cy="376" r="4" fill="#FFFFFF"/></g><text x="187.5" y="424" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">Ajustá el punto en el mapa</text></g><g id="Campo Teléfono"><text x="20" y="454" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Teléfono</text><rect x="20" y="462" width="160" height="40" rx="4" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/><text x="32" y="487.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#AAAAAA" text-anchor="start">(02324) 42-1234</text></g><g id="Campo Horarios"><text x="195" y="454" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Horarios</text><rect x="195" y="462" width="160" height="40" rx="4" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/><text x="207" y="487.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#AAAAAA" text-anchor="start">Lun a vie 8 a 18</text></g><g id="Campo Nombre del responsable"><text x="20" y="520" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Nombre del responsable</text><rect x="20" y="528" width="335" height="40" rx="4" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/><text x="32" y="553.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#AAAAAA" text-anchor="start">Nombre y apellido</text></g><g id="Campo Email"><text x="20" y="586" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Email</text><rect x="20" y="594" width="335" height="40" rx="4" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/><text x="32" y="619.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#AAAAAA" text-anchor="start">taller@ejemplo.com</text></g><g id="Campo Contraseña"><text x="20" y="652" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Contraseña</text><rect x="20" y="660" width="335" height="40" rx="4" fill="#F5F5F5" stroke="#CCCCCC" stroke-width="1"/><text x="32" y="685.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#AAAAAA" text-anchor="start">Mínimo 8 caracteres</text></g><g id="Condiciones"><rect x="20" y="720" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/><text x="50" y="735" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" text-anchor="start">Acepto las condiciones de adhesión: descuentos</text><text x="50" y="753" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#333333" text-anchor="start">por plan y uso del checklist de AutoCar.</text></g><g id="Botón Enviar solicitud"><rect x="20" y="778" width="335" height="44" rx="4" fill="#333333"/><text x="187.5" y="805.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Enviar solicitud</text></g><text x="187.5" y="848" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">La cuenta queda pendiente hasta que la apruebe un administrador.</text></svg>
